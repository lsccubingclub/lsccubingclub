name: nightly-data
on:
  schedule:
    - cron: '0 22 * * *' # daily at 22:00 UTC, change as needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create service account file
        env:
          SA_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "Missing SERVICE_ACCOUNT_JSON secret" && exit 1
          fi
          echo "$SA_JSON" > service_account_temp.json
          chmod 600 service_account_temp.json

      - name: Run nightly Python scripts
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p data
          python scripts/fetch_wca_profiles.py
          python scripts/merge_lsc.py
          python scripts/generate_rankings.py

      - name: Commit and push generated data if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: nightly update generated data [ci skip]" || true
          git push origin HEAD:${{ github.ref }}
